server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

spring:
  application:
    name: puxun-website

  # 默认使用 H2 数据库（开发环境），生产环境切换为 MySQL
  datasource:
    url: jdbc:h2:mem:puxun_website
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
# MySQL 生产环境配置
spring:
  config:
    activate:
      on-profile: production

  datasource:
    url: jdbc:mysql://localhost:3306/puxun_website?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
