<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="钢厂数字化健康度自评 · 30 题 · 5 分钟出报告">
<title>钢厂数字化健康度自评 - 5 分钟出报告</title>
<style>
:root {
  --primary: #1F4E79;
  --accent: #2E75B6;
  --bg: #F4F7FB;
  --card: #FFFFFF;
  --border: #E1E8F0;
  --good: #52C41A;
  --warn: #FAAD14;
  --bad: #FF4D4F;
  --text: #1F2937;
  --muted: #6B7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
               "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding: 0 16px;
}

.container { max-width: 720px; margin: 0 auto; padding: 24px 0 80px; }

.header {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  padding: 32px 24px;
  border-radius: 12px;
  margin-bottom: 24px;
  text-align: center;
}
.header h1 { font-size: 24px; margin-bottom: 8px; }
.header p { opacity: 0.9; font-size: 14px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}

.progress-wrap {
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0;
  background: var(--bg);
  padding: 12px 0;
  margin: -12px 0 12px;
  z-index: 10;
}
.progress { flex: 1; height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); transition: width .3s; width: 0%; }
.progress-text { font-size: 13px; color: var(--muted); white-space: nowrap; }

.step-input { display: flex; flex-direction: column; gap: 12px; }
.step-input label { font-size: 13px; color: var(--muted); }
.step-input input, .step-input select {
  width: 100%; padding: 12px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 15px; background: white;
}
.step-input input:focus, .step-input select:focus { border-color: var(--accent); outline: none; }

.q-num { font-size: 13px; color: var(--accent); font-weight: 600; }
.q-cat { font-size: 12px; color: var(--muted); margin-left: 8px; }
.q-title { font-size: 16px; margin: 6px 0 16px; line-height: 1.5; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all .15s;
  background: white;
}
.option:hover { border-color: var(--accent); background: #F8FBFE; }
.option.selected { border-color: var(--primary); background: #EAF3FA; }
.option .score { font-size: 12px; color: var(--muted); padding: 2px 8px; border-radius: 999px; background: var(--border); }
.option.selected .score { background: var(--primary); color: white; }
.option .text { flex: 1; font-size: 14px; }

.btn {
  display: inline-block;
  padding: 14px 28px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: background .15s;
}
.btn:hover { background: #163E61; }
.btn-block { display: block; width: 100%; text-align: center; }
.btn-secondary { background: white; color: var(--primary); border: 1px solid var(--primary); }

.nav { display: flex; gap: 12px; margin-top: 16px; }
.nav .btn { flex: 1; }

/* Result */
.result-grade {
  text-align: center;
  padding: 28px;
  border-radius: 12px;
  color: white;
  margin-bottom: 16px;
}
.grade-A { background: linear-gradient(135deg, #52C41A, #389E0D); }
.grade-B { background: linear-gradient(135deg, #FAAD14, #D48806); }
.grade-C { background: linear-gradient(135deg, #FA8C16, #D46B08); }
.grade-D { background: linear-gradient(135deg, #FF4D4F, #CF1322); }
.result-grade h2 { font-size: 36px; margin-bottom: 8px; }
.result-grade p { font-size: 14px; opacity: 0.95; }

.score-bar { display: flex; flex-direction: column; gap: 8px; }
.score-bar .row { display: flex; align-items: center; gap: 12px; }
.score-bar .label { width: 110px; font-size: 13px; color: var(--text); }
.score-bar .bar { flex: 1; height: 14px; background: var(--border); border-radius: 999px; overflow: hidden; position: relative; }
.score-bar .fill { height: 100%; transition: width .6s; border-radius: 999px; }
.score-bar .fill.good { background: var(--good); }
.score-bar .fill.warn { background: var(--warn); }
.score-bar .fill.bad { background: var(--bad); }
.score-bar .pct { width: 60px; text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.recommendation {
  background: #F0F8FF;
  border-left: 4px solid var(--primary);
  padding: 14px 16px;
  border-radius: 4px;
  font-size: 14px;
  margin: 12px 0;
}

.contact {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  padding: 24px;
  border-radius: 12px;
  text-align: center;
}
.contact h3 { font-size: 18px; margin-bottom: 8px; }
.contact p { opacity: 0.95; font-size: 14px; margin-bottom: 16px; }
.contact .btn { background: white; color: var(--primary); }

.footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 0; }

.hide { display: none; }

@media print {
  .header, .nav, .progress-wrap, .contact, .footer { display: none; }
  body { background: white; }
}
</style>
</head>
<body>
<div class="container">

<!-- Header -->
<div class="header">
  <h1>钢厂数字化健康度自评</h1>
  <p>30 题 · 5 分钟 · 立即出报告 · 完全免费</p>
</div>

<!-- Step 1: 基础信息 -->
<div id="step-info" class="card">
  <div class="q-num">第 1 步 / 共 3 步</div>
  <h2 class="q-title">告诉我们一些基础信息</h2>
  <div class="step-input">
    <div>
      <label>企业名称</label>
      <input type="text" id="company" placeholder="例：邯郸 XX 钢管科技有限公司">
    </div>
    <div>
      <label>主营业务</label>
      <select id="business">
        <option>钢管生产（焊管/无缝/精密管）</option>
        <option>镀锌 / 冷卷</option>
        <option>开平 / 纵剪</option>
        <option>一体厂（多类业务）</option>
      </select>
    </div>
    <div>
      <label>产线/机组数</label>
      <input type="number" id="lines" placeholder="例：4" min="1">
    </div>
    <div>
      <label>您的姓名/职务</label>
      <input type="text" id="name" placeholder="例：张总 / 董事长">
    </div>
    <div>
      <label>您的手机号（用于接收 PDF 报告，不会用作其他用途）</label>
      <input type="tel" id="phone" placeholder="例：138-XXXX-XXXX" pattern="[0-9-]*">
    </div>
  </div>
  <button class="btn btn-block" style="margin-top: 20px;" onclick="startQuiz()">开始 5 分钟自评 →</button>
</div>

<!-- Step 2: 30 题 -->
<div id="step-quiz" class="card hide">
  <div class="progress-wrap">
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="progress-text" id="progress-text">0 / 30</div>
  </div>
  <div class="q-num">第 <span id="q-idx">1</span> 题 <span class="q-cat" id="q-cat">销售订单</span></div>
  <h2 class="q-title" id="q-title">题目载入中…</h2>
  <div class="options" id="q-options"></div>
  <div class="nav">
    <button class="btn btn-secondary" onclick="prevQ()">← 上一题</button>
    <button class="btn" onclick="nextQ()" id="next-btn">下一题 →</button>
  </div>
</div>

<!-- Step 3: 结果 -->
<div id="step-result" class="hide">
  <div class="result-grade" id="result-grade">
    <h2 id="grade-letter">B</h2>
    <p id="grade-text">亚健康（B 级）</p>
    <p style="font-size: 13px; margin-top: 8px;">总分 <span id="total-score">0</span> / 150</p>
  </div>

  <div class="card">
    <h3 style="margin-bottom: 16px;">六大模块得分</h3>
    <div class="score-bar" id="module-scores"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom: 12px;">您的数字化处方</h3>
    <div class="recommendation" id="recommendation"></div>
    <h4 style="margin: 16px 0 8px; font-size: 14px;">最优先解决的 3 个痛点</h4>
    <ol id="top-pains" style="padding-left: 20px; font-size: 14px; line-height: 1.8;"></ol>
  </div>

  <div class="contact">
    <h3>免费获取详细诊断报告</h3>
    <p>专家将在 1 个工作日内联系您，含 PDF 报告 + 同行案例 + 行动建议</p>
    <a class="btn" href="javascript:void(0)" onclick="submitContact()">领取详细报告</a>
  </div>

  <div class="card" style="margin-top: 16px; text-align: center;">
    <button class="btn btn-secondary" onclick="window.print()">打印 / 保存 PDF</button>
    <button class="btn btn-secondary" style="margin-left: 8px;" onclick="restart()">重新评估</button>
  </div>
</div>

<div class="footer">
  © 钢联数字化 · 钢厂数字化健康度自评 v1.0 · 联系电话 400-XXX-XXXX
</div>

</div>

<script>
// 30 题题库（参考 docs/07）
const QUESTIONS = [
  // 销售订单与计划（5 题）
  { cat: '销售订单', q: '客户急单进来，您能多久回复"能不能按期交"？', opts: [['1 小时内', 5], ['半天', 3], ['1 天以上', 1]] },
  { cat: '销售订单', q: '每月临时插单占总订单的比例？', opts: [['<10%', 5], ['10-30%', 3], ['>30%', 1]] },
  { cat: '销售订单', q: '排产计划是怎么做的？', opts: [['系统自动', 5], ['计划员 Excel', 3], ['车间主任拍脑袋', 1]] },
  { cat: '销售订单', q: '客户问"我那批货生产到哪一步了"，多久能查到？', opts: [['立即', 5], ['半小时', 3], ['查半天', 1]] },
  { cat: '销售订单', q: '上个月有几次因为计划问题导致客户投诉？', opts: [['0 次', 5], ['1-3 次', 3], ['>3 次', 1]] },

  // 生产执行与质量（6 题）
  { cat: '生产质量', q: '每条产线每天的产量、合格率您手机上能看到吗？', opts: [['实时看', 5], ['第二天', 3], ['月底统计', 1]] },
  { cat: '生产质量', q: '客户投诉某卷货，您要多久找到这卷货是哪条线、哪个班次生产的？', opts: [['5 秒', 5], ['半天', 3], ['找不到', 1]] },
  { cat: '生产质量', q: '质检数据是手写还是录电脑？', opts: [['系统直采', 5], ['录电脑', 3], ['手写本', 1]] },
  { cat: '生产质量', q: '炉号 / 卷号 / 批次的追溯怎么做？', opts: [['扫码', 5], ['Excel', 3], ['没记', 1]] },
  { cat: '生产质量', q: '客户审厂时（汽车/家电），您拿什么数据应对？', opts: [['一键导出', 5], ['临时整理', 3], ['没有数据', 1]] },
  { cat: '生产质量', q: '次品率您能算到具体哪个工序、哪个班次吗？', opts: [['能', 5], ['到产线', 3], ['算不到', 1]] },

  // 库存物流（4 题）
  { cat: '库存物流', q: '原料、半成品、成品的库存系统里和实际差多少？', opts: [['<1%', 5], ['1-5%', 3], ['>5% 或不知道', 1]] },
  { cat: '库存物流', q: '找一卷货从库里调出来需要多久？', opts: [['10 分钟', 5], ['1 小时', 3], ['半天', 1]] },
  { cat: '库存物流', q: '盘点一次要花几天？', opts: [['1 天', 5], ['2-3 天', 3], ['>3 天', 1]] },
  { cat: '库存物流', q: '您有多少呆滞料？金额多少？', opts: [['<5%', 5], ['5-15%', 3], ['>15% 或不知道', 1]] },

  // 成本财务（5 题）
  { cat: '成本财务', q: '今天生产的这批管子，成本是多少您知道吗？', opts: [['知道', 5], ['月底知道', 3], ['没人能算清楚', 1]] },
  { cat: '成本财务', q: '成本核算是怎么做的？', opts: [['系统自动', 5], ['财务月底手工', 3], ['拍脑袋', 1]] },
  { cat: '成本财务', q: '财务月报多久能出？', opts: [['5 天内', 5], ['10 天内', 3], ['>15 天', 1]] },
  { cat: '成本财务', q: '应收账款超期 30 天以上的有多少？', opts: [['<5%', 5], ['5-15%', 3], ['>15% 或不知道', 1]] },
  { cat: '成本财务', q: '您能不能算清楚每个客户、每个产品的真实毛利？', opts: [['能', 5], ['大概知道', 3], ['算不清', 1]] },

  // 设备工艺（4 题）
  { cat: '设备工艺', q: '设备故障停机时间您每月统计吗？', opts: [['自动统计', 5], ['手工记', 3], ['不统计', 1]] },
  { cat: '设备工艺', q: '设备保养是按计划还是坏了再修？', opts: [['计划保养为主', 5], ['各占一半', 3], ['坏了再修', 1]] },
  { cat: '设备工艺', q: 'OEE（设备综合效率）您算吗？', opts: [['算且看', 5], ['算但少看', 3], ['不算', 1]] },
  { cat: '设备工艺', q: '工艺参数（如焊接电流、镀锌温度）有没有自动记录？', opts: [['全自动', 5], ['部分', 3], ['手抄', 1]] },

  // 管理决策（6 题）
  { cat: '管理决策', q: '您的核心管理数据多久看一次？', opts: [['每天', 5], ['每周', 3], ['每月', 1]] },
  { cat: '管理决策', q: '出问题时，开会扯皮多还是数据说话多？', opts: [['数据说话', 5], ['一半一半', 3], ['全靠扯皮', 1]] },
  { cat: '管理决策', q: '您不在厂里时，能在手机上看到生产情况吗？', opts: [['能', 5], ['部分', 3], ['不能', 1]] },
  { cat: '管理决策', q: '您的二代/接班人对现在的管理方式认同吗？', opts: [['认同', 5], ['一半', 3], ['不认同', 1]] },
  { cat: '管理决策', q: '下游客户（汽车/家电/家具）有没有要求过您上数字化系统？', opts: [['强要求', 5], ['提过', 3], ['没提过', 1]] },
  { cat: '管理决策', q: '您觉得 3 年内不上数字化系统，企业会怎么样？', opts: [['会被淘汰', 5], ['影响竞争力', 3], ['没影响', 1]] },
];

const MODULES = ['销售订单', '生产质量', '库存物流', '成本财务', '设备工艺', '管理决策'];
const MODULE_MAX = { '销售订单': 25, '生产质量': 30, '库存物流': 20, '成本财务': 25, '设备工艺': 20, '管理决策': 30 };

let currentIdx = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let userInfo = {};

function startQuiz() {
  const company = document.getElementById('company').value.trim();
  const phone = document.getElementById('phone').value.trim();
  if (!company || !phone) { alert('请填写企业名称和手机号'); return; }
  userInfo = {
    company,
    business: document.getElementById('business').value,
    lines: document.getElementById('lines').value,
    name: document.getElementById('name').value,
    phone,
  };
  document.getElementById('step-info').classList.add('hide');
  document.getElementById('step-quiz').classList.remove('hide');
  renderQ();
}

function renderQ() {
  const q = QUESTIONS[currentIdx];
  document.getElementById('q-idx').textContent = currentIdx + 1;
  document.getElementById('q-cat').textContent = q.cat;
  document.getElementById('q-title').textContent = q.q;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (answers[currentIdx] === opt[1] ? ' selected' : '');
    div.innerHTML = `<span class="text">${opt[0]}</span><span class="score">${opt[1]} 分</span>`;
    div.onclick = () => {
      answers[currentIdx] = opt[1];
      renderQ();
      setTimeout(nextQ, 250);
    };
    opts.appendChild(div);
  });
  document.getElementById('progress-bar').style.width = ((currentIdx + 1) / QUESTIONS.length * 100) + '%';
  document.getElementById('progress-text').textContent = `${currentIdx + 1} / ${QUESTIONS.length}`;
  document.getElementById('next-btn').textContent = currentIdx === QUESTIONS.length - 1 ? '查看报告 →' : '下一题 →';
}

function prevQ() { if (currentIdx > 0) { currentIdx--; renderQ(); } }

function nextQ() {
  if (answers[currentIdx] === null) { alert('请先选择一个选项'); return; }
  if (currentIdx < QUESTIONS.length - 1) { currentIdx++; renderQ(); }
  else { showResult(); }
}

function showResult() {
  document.getElementById('step-quiz').classList.add('hide');
  document.getElementById('step-result').classList.remove('hide');

  const moduleScores = {};
  MODULES.forEach(m => moduleScores[m] = 0);
  QUESTIONS.forEach((q, i) => { moduleScores[q.cat] += answers[i] || 0; });
  const total = Object.values(moduleScores).reduce((a,b) => a+b, 0);

  document.getElementById('total-score').textContent = total;

  let grade, gradeText, gradeClass, recText;
  if (total >= 130) {
    grade = 'A'; gradeText = '健康（A 级）';
    gradeClass = 'grade-A';
    recText = '您已具备较好的数字化基础，建议升级到「旗舰版」做深度优化（APS 高级排程 + BI 大屏 + 集团合并报表），打造行业灯塔标杆。';
  } else if (total >= 100) {
    grade = 'B'; gradeText = '亚健康（B 级）';
    gradeClass = 'grade-B';
    recText = '单点能力可以，整体协同弱。建议「经营版」+ A 经典模式，3 个月内打通核心 4-6 个模块。';
  } else if (total >= 70) {
    grade = 'C'; gradeText = '病弱（C 级）';
    gradeClass = 'grade-C';
    recText = '多个模块缺失。建议先「种子版」试点 1-2 个最痛模块（成本核算 / 质量追溯），3 周见效再升级。';
  } else {
    grade = 'D'; gradeText = '危险（D 级）';
    gradeClass = 'grade-D';
    recText = '数字化几乎为零。强烈建议预约 3 天免费工作坊，先做流程梳理 + 路径图，再决定从哪里下手。';
  }

  document.getElementById('grade-letter').textContent = grade;
  document.getElementById('grade-text').textContent = gradeText;
  document.getElementById('result-grade').className = 'result-grade ' + gradeClass;
  document.getElementById('recommendation').innerHTML = recText;

  // 模块得分条
  const sb = document.getElementById('module-scores');
  sb.innerHTML = '';
  MODULES.forEach(m => {
    const score = moduleScores[m];
    const max = MODULE_MAX[m];
    const pct = score / max;
    const cls = pct >= 0.8 ? 'good' : pct >= 0.5 ? 'warn' : 'bad';
    sb.innerHTML += `
      <div class="row">
        <div class="label">${m}</div>
        <div class="bar"><div class="fill ${cls}" style="width: ${pct*100}%"></div></div>
        <div class="pct">${score} / ${max}</div>
      </div>`;
  });

  // TOP 3 痛点
  const sortedModules = MODULES.map(m => ({m, pct: moduleScores[m] / MODULE_MAX[m]}))
                                .sort((a,b) => a.pct - b.pct);
  const painMap = {
    '销售订单': '订单与计划响应慢、急单插入混乱 → 推荐先上 MES 排程模块',
    '生产质量': '质量追溯困难、质检数据零散 → 推荐质量追溯（最快 3 周见效）',
    '库存物流': '账实差大、呆滞料无法识别 → 推荐 WMS + 卷号扫码',
    '成本财务': '成本算不准、月报滞后 → 推荐成本自动化核算（开平/钢管厂首选）',
    '设备工艺': '设备故障无统计、保养靠经验 → 推荐 EAM 设备管理',
    '管理决策': '老板看不到实时数据、扯皮多 → 推荐 BI 大屏 + 移动端',
  };
  const top = document.getElementById('top-pains');
  top.innerHTML = '';
  sortedModules.slice(0, 3).forEach(item => {
    top.innerHTML += `<li>${painMap[item.m]}</li>`;
  });
}

function submitContact() {
  const data = {
    ...userInfo,
    grade: document.getElementById('grade-letter').textContent,
    score: document.getElementById('total-score').textContent,
    timestamp: new Date().toISOString(),
  };
  // 实际部署时替换为真实接口
  console.log('提交数据：', data);
  alert(`已收到！我们将在 1 个工作日内联系您（${userInfo.phone}）发送详细诊断报告。\n\n感谢您的信任！`);
}

function restart() {
  currentIdx = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  document.getElementById('step-result').classList.add('hide');
  document.getElementById('step-info').classList.remove('hide');
}
